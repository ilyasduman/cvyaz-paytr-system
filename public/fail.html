<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CVYAZ | Ödeme Başarısız</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f5f7;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 26px;
      padding: 24px;
      box-shadow: 0 18px 44px rgba(15,23,42,.14);
      text-align: center;
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 0 0 18px; font-size: 14px; opacity: .66; line-height: 1.55; }
    a {
      display: block;
      width: 100%;
      border-radius: 16px;
      padding: 15px;
      background: #111;
      color: #fff;
      font-weight: 900;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Ödeme tamamlanmadı</h1>
    <p>Kart işlemi başarısız oldu veya işlem iptal edildi. CV bilgileriniz tarayıcıda duruyorsa tekrar deneyebilirsiniz.</p>
    <a href="/">Tekrar Dene</a>
  </main>
</body>
</html>
