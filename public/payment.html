<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CVYAZ | Güvenli Ödeme</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background: #f4f5f7; color: #111; }
    .top {
      background: #111;
      color: #fff;
      padding: 14px;
      text-align: center;
      font-weight: 900;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .wrap {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 14px;
    }
    .card {
      background: #fff;
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 12px 34px rgba(15,23,42,.12);
      margin-top: 14px;
    }
    iframe {
      width: 100%;
      min-height: 760px;
      border: 0;
      border-radius: 16px;
      background: #fff;
    }
    .note {
      font-size: 13px;
      opacity: .65;
      line-height: 1.5;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="top">🔒 CVYAZ Güvenli Ödeme</div>

  <main class="wrap">
    <section class="card">
      <iframe id="paytriframe" frameborder="0" scrolling="no"></iframe>
      <p class="note">Ödeme tamamlanınca temiz PDF indirme ekranına yönlendirileceksiniz.</p>
    </section>
  </main>

  <script src="https://www.paytr.com/js/iframeResizer.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
      document.body.innerHTML = "<div style='padding:24px;text-align:center;font-family:Arial'>Ödeme token bulunamadı.</div>";
    } else {
      const iframe = document.getElementById("paytriframe");
      iframe.src = "https://www.paytr.com/odeme/guvenli/" + encodeURIComponent(token);

      if (window.iFrameResize) {
        iFrameResize({}, "#paytriframe");
      }
    }
  </script>
</body>
</html>
